workflows:
  android-apk:
    name: SnapChart Android APK
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      flutter: stable
    working_directory: mobile
    scripts:
      - name: Prepare and generate Android
        script: |
          set -e
          echo "=== PWD ==="
          pwd
          echo "=== Listing files ==="
          ls -la
          echo "=== Flutter version ==="
          flutter --version
          echo "=== Running flutter create (this generates the android folder) ==="
          flutter create --platforms=android --org=com.snapchart --project-name=snapchart .
          echo "=== After flutter create ==="
          ls -la
          if [ ! -d "android" ]; then
            echo "ERROR: android folder still missing after flutter create"
            exit 1
          fi
          echo "Android folder successfully created"
      - name: Get dependencies
        script: |
          set -e
          flutter pub get
      - name: Build release APK
        script: |
          set -e
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/**/outputs/**/*.apk
